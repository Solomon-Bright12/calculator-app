<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css"> <!-- calling css file -->
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=RNsqmCP8joVQ&format=png&color=000000">
</head>

<body>
    <!-- container -->
    <div class="calculatorBody">
        
        <div id="Output" class="Output"></div>
        <div class="box"></div><!--just a box-->
        
        <div class="keyboard"><!-- for taking inputs-->
            <div class="top_operators">
                <button><h1>(</h1></button>
                <button><h1>)</h1></button>
                <button><h1>%</h1></button>
                <button><h1>π</h1></button>
                <button><h1>^</h1></button>
            </div>
            
            <div class="NumberAndOperator">
                <div class="Numbers">
                    <button><h1>7</h1></button>
                    <button><h1>8</h1></button>
                    <button><h1>9</h1></button>
                    <button><h1>4</h1></button>
                    <button><h1>5</h1></button>
                    <button><h1>6</h1></button>
                    <button><h1>1</h1></button>
                    <button><h1>2</h1></button>
                    <button><h1>3</h1></button>
                    <button class="operator"><h1>.</h1></button>
                    <button><h1>0</h1></button>
                    <button class="operator"><h1>=</h1></button>
                </div>
                <div class="rightOperators">
                    <button><h3>DeL</h3></button>
                    <button><h1>÷</h1></button>
                    <button><h1>×</h1></button>
                    <button><h1>-</h1></button>
                    <button><h1>+</h1></button>
                </div>
            </div>
        </div>
    </div>
    <div class="intro">
     </h1>this is a simple calculator project made by beginners in a programming 
     <div class="btn-group">
        <button type="button" class="btn btn-default">Left</button>
        <button type="button" class="btn btn-default">Middle</button>
        <button type="button" class="btn btn-default">Right</button>
     </div>
     </h1>
    </div>
    <script src="script.js">//calling javascrip</script>
</body>
</html>
