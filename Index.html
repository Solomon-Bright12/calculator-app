<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .calculatorBody {
            width: 350px;
            height: 600px;
            border: 5px solid black;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: auto;
            margin-top: 50px;
            flex-direction: column;
            padding-top: 20px;
            padding-bottom: 20px;
            background: #55d5ff;
            box-shadow: 10px 0px 100px black, 0px 10px 100px black;
            z-index: 10;
        }
        .Output {
            width: 90%;
            height: 60px;
            border: 5px solid black;
            border-radius: 5px;
            padding: 10px;
            padding-left: 10px;
            background-color: white;
            display: flex;
            justify-content: right;
            align-items: center;
            overflow-y: hidden;
            overflow-x: scroll;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            font-weight: 400;
            font-size: 30px;
            
        }
        .box {
            width: 100px;
            height: 20px; 
            border: 2px solid black;
            border-radius: 2px;
            float: right;
        }
        .keyboard {
            width: 90%;
            height: 500px;
            border: 2px solid black;
            border-radius: 10px;
            background: #c7bfa6;
            overflow: hidden;
        }
        .top_operators{
            width: 100%;
            display: grid;
            grid-template-columns: 58px 58px 57px 57px 75px;
            grid-template-rows: 65px;
        }
        .top_operators button {
            display: flex;
            align-items: center;
            justify-content: center;
            background: yellow;
            border: 1px solid black;
        }
        .top_operators button:active {
            background: #00d4ff;
        }
        .NumberAndOperator {
            display: flex;
            flex-direction: row;
        }
        .Numbers {
            width: 330px;
            height: 390px;
            border: 1px solid black;
            display: grid;
            grid-template-columns: 76px 76px 76px;
            grid-template-rows: 103px 103px 103px;
            overflow: hidden;
        }
        .Numbers button {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .Numbers button:active {
            background: #00d4ff;
        }
        .rightOperators {
            float: right;
            display: grid;
            grid-template-columns: 80px;
            grid-template-rows: 70px 70px 70px 70px 110px;
            border: none;
        }
        .rightOperators button {
            background: yellow;
            border: 1px solid black;
        }
        .operator {
            border: none;
            background: yellow;
        }
        button:active {
            background: #00d4ff;
        }
        
    </style>
</head>

<body>
    <!-- container -->
    <div class="calculatorBody">
        
        <div id="Output" class="Output"></div>
        <div class="box"></div><!--just a box-->
        
        <div class="keyboard"><!-- for taking inputs-->
            <div class="top_operators">
                <button><h1>(</h1></button>
                <button><h1>)</h1></button>
                <button><h1>%</h1></button>
                <button><h1>π</h1></button>
                <button><h1>^</h1></button>
            </div>
            
            <div class="NumberAndOperator">
                <div class="Numbers">
                    <button><h1>7</h1></button>
                    <button><h1>8</h1></button>
                    <button><h1>9</h1></button>
                    <button><h1>4</h1></button>
                    <button><h1>5</h1></button>
                    <button><h1>6</h1></button>
                    <button><h1>1</h1></button>
                    <button><h1>2</h1></button>
                    <button><h1>3</h1></button>
                    <button class="operator"><h1>.</h1></button>
                    <button><h1>0</h1></button>
                    <button class="operator"><h1>=</h1></button>
                </div>
                <div class="rightOperators">
                    <button><h3>DeL</h3></button>
                    <button><h1>÷</h1></button>
                    <button><h1>×</h1></button>
                    <button><h1>-</h1></button>
                    <button><h1>+</h1></button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // add js here 😉 happy coding
        
    </script>
</body>
</html>
